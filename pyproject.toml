[project]
name = "ekb-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "scrapy>=2.20.0",
]

[project.scripts]
ui = "ekb_parser.web.app:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
